server {
		listen 80;
		server_name relay-analytics-holesky.ultrasound.money relay-analytics-hoodi.ultrasound.money;

		location = / {
				return 301 https://github.com/ultrasoundmoney/docs;
		}
}

# RPC endpoints - accept bundle submissions
server {
		listen 80;
		server_name rpc-eu.ultrasound.money rpc-eu-hoodi.ultrasound.money;

		location / {
				default_type application/json;
				return 202 '{"result":202,"error":null}';
		}
}

# Local backend that returns 202 - proxy_pass to this so mirror fires reliably
server {
		listen 127.0.0.1:8080;
		access_log off;

		location / {
				default_type application/json;
				return 202 '{"result":202,"error":null}';
		}
}

server {
		listen 80;
		server_name rpc-jp.ultrasound.money builder-rpc-jp.ultrasound.money;

		location / {
				mirror /forward_to_rbx_mainnet;
				mirror_request_body on;

				proxy_pass http://127.0.0.1:8080;
		}

		location = /forward_to_rbx_mainnet {
				internal;
				resolver 8.8.8.8;
				proxy_pass https://rpc-eu.ultrasound.money$request_uri;
				proxy_set_header Host rpc-eu.ultrasound.money;
				proxy_set_header X-Origin-Geo "tyo";
				proxy_set_header X-Received-At-Ms $msec;
				proxy_ssl_server_name on;
		}
}

server {
		listen 80;
		server_name rpc-jp-hoodi.ultrasound.money builder-rpc-jp-hoodi.ultrasound.money;

		location / {
				mirror /forward_to_rbx;
				mirror_request_body on;

				proxy_pass http://127.0.0.1:8080;
		}

		location = /forward_to_rbx {
				internal;
				resolver 8.8.8.8;
				proxy_pass https://rpc-eu-hoodi.ultrasound.money$request_uri;
				proxy_set_header Host rpc-eu-hoodi.ultrasound.money;
				proxy_set_header X-Origin-Geo "tyo";
				proxy_set_header X-Received-At-Ms $msec;
				proxy_ssl_server_name on;
		}
}

server {
		listen 80;
		server_name *.ultrasound.money;

		location = /eth/v1/builder/status {
				return 200;
		}
}
